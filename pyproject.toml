[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "polymarket-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "eth-account>=0.10.0",
    "requests>=2.31.0",
]

[project.scripts]
polymarket = "polymarket.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["polymarket*"]
